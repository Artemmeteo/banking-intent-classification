x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  networks: [mlops]

services:
  api:
    networks: [mlops]
    volumes: !reset []
    environment:
      TEXT_CLF_MODEL__SOURCE: registry
      TEXT_CLF_MODEL__URI: models:/${TEXT_CLF_MLFLOW__REGISTERED_MODEL_NAME:-banking77-intent-classifier}@${TEXT_CLF_MLFLOW__CHAMPION_ALIAS:-champion}
      TEXT_CLF_MLFLOW__TRACKING_URI: http://mlflow:5000
      TEXT_CLF_MODEL__DEVICE: ${TEXT_CLF_MODEL__DEVICE:-cpu}
      TEXT_CLF_MODEL__LOCAL_FILES_ONLY: ${TEXT_CLF_MODEL__LOCAL_FILES_ONLY:-true}
      TEXT_CLF_API__MAX_CONCURRENCY: ${TEXT_CLF_API__MAX_CONCURRENCY:-4}
      TEXT_CLF_API__SHUTDOWN_TIMEOUT_SECONDS: ${TEXT_CLF_API__SHUTDOWN_TIMEOUT_SECONDS:-20}
      TEXT_CLF_OBSERVABILITY__LOG_LEVEL: ${TEXT_CLF_OBSERVABILITY__LOG_LEVEL:-INFO}
      TEXT_CLF_OBSERVABILITY__JSON_LOGS: ${TEXT_CLF_OBSERVABILITY__JSON_LOGS:-true}
    depends_on:
      mlflow:
        condition: service_healthy
    profiles: [mlops]

  postgres:
    <<: *service-defaults
    image: postgres:17.6-bookworm
    profiles: [mlops]
    environment:
      POSTGRES_USER: text_clf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mlflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-airflow.sql:ro
    cpus: "1.0"
    mem_limit: 1g
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U text_clf -d mlflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    <<: *service-defaults
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [mlops]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    cpus: "1.0"
    mem_limit: 1g
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    <<: *service-defaults
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: [mlops]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        mc mb --ignore-existing local/mlflow;
        mc mb --ignore-existing local/text-clf-dvc
    cpus: "0.25"
    mem_limit: 128m

  mlflow:
    <<: *service-defaults
    build:
      context: infra/mlflow
    image: text-clf-mlflow:3.14.0
    profiles: [mlops]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql+psycopg2://text_clf:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      - --artifacts-destination=s3://mlflow
      - --serve-artifacts
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MLFLOW_PORT:-5000}:5000"
    cpus: "1.0"
    mem_limit: 1g
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 12

  airflow-init:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infra/airflow/Dockerfile
    image: text-clf-airflow:3.1.8
    profiles: [mlops]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://text_clf:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/text-clf/dags
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api:8080/execution/
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      TEXT_CLF_PROJECT_DIR: /opt/text-clf
      TEXT_CLF_MLFLOW__TRACKING_URI: http://mlflow:5000
      TEXT_CLF_MLFLOW__EXPERIMENT_NAME: ${TEXT_CLF_MLFLOW__EXPERIMENT_NAME:-banking77-classification}
      TEXT_CLF_MLFLOW__REGISTERED_MODEL_NAME: ${TEXT_CLF_MLFLOW__REGISTERED_MODEL_NAME:-banking77-intent-classifier}
      TEXT_CLF_MLFLOW__CANDIDATE_ALIAS: ${TEXT_CLF_MLFLOW__CANDIDATE_ALIAS:-candidate}
      TEXT_CLF_MLFLOW__CHAMPION_ALIAS: ${TEXT_CLF_MLFLOW__CHAMPION_ALIAS:-champion}
    volumes: &airflow-volumes
      - .:/opt/text-clf
      - airflow-logs:/opt/airflow/logs
    command: db migrate
    cpus: "1.0"
    mem_limit: 1g

  airflow-scheduler:
    <<: *service-defaults
    image: text-clf-airflow:3.1.8
    profiles: [mlops]
    networks: [mlops, egress]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment: *airflow-environment
    volumes: *airflow-volumes
    command: scheduler
    cpus: "1.0"
    mem_limit: 2g

  airflow-api:
    <<: *service-defaults
    image: text-clf-airflow:3.1.8
    profiles: [mlops]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    volumes: *airflow-volumes
    command: api-server
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${AIRFLOW_PORT:-8080}:8080"
    cpus: "1.0"
    mem_limit: 1g
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v2/monitor/health', timeout=2)"
      interval: 15s
      timeout: 10s
      retries: 10

networks:
  mlops:
    internal: true
  egress:

volumes:
  postgres-data:
  minio-data:
  airflow-logs:
