x-api-common: &api-common
  build:
    context: .
    target: runtime
  image: text-clf-api:0.2.0
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  environment:
    TEXT_CLF_MODEL__SOURCE: local
    TEXT_CLF_MODEL__URI: /models/current
    TEXT_CLF_MODEL__DEVICE: ${TEXT_CLF_MODEL__DEVICE:-cpu}
    TEXT_CLF_MODEL__LOCAL_FILES_ONLY: ${TEXT_CLF_MODEL__LOCAL_FILES_ONLY:-true}
    TEXT_CLF_API__MAX_CONCURRENCY: ${TEXT_CLF_API__MAX_CONCURRENCY:-4}
    TEXT_CLF_API__SHUTDOWN_TIMEOUT_SECONDS: ${TEXT_CLF_API__SHUTDOWN_TIMEOUT_SECONDS:-20}
    TEXT_CLF_OBSERVABILITY__LOG_LEVEL: ${TEXT_CLF_OBSERVABILITY__LOG_LEVEL:-INFO}
    TEXT_CLF_OBSERVABILITY__JSON_LOGS: ${TEXT_CLF_OBSERVABILITY__JSON_LOGS:-true}
  volumes:
    - ${MODEL_PACKAGE_DIR:-./artifacts/model-package}:/models/current:ro
  ports:
    - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
  cpus: "2.0"
  mem_limit: 2g
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"
    interval: 10s
    timeout: 3s
    retries: 12
    start_period: 30s
  stop_grace_period: 25s

services:
  api:
    <<: *api-common
