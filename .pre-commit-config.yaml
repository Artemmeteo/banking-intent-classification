repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format check
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: pytest-unit
        name: pytest unit and contract
        entry: uv run pytest tests/unit tests/contract
        language: system
        pass_filenames: false
      - id: repository-hygiene
        name: tracked secret and large-file guard
        entry: uv run pytest tests/quality/test_repository_hygiene.py
        language: system
        pass_filenames: false
