[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "text-classification"
version = "0.2.0"
description = "Offline-first Banking77 intent classification service and MLOps pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.138.1",
    "mlflow-skinny==3.14.0",
    "prometheus-client==0.23.1",
    "PyYAML==6.0.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.12.0",
    "safetensors==0.8.0",
    "torch==2.12.1",
    "transformers==5.12.1",
    "uvicorn==0.49.0",
]

[project.scripts]
text-clf = "text_clf.cli:main"
text-clf-data = "text_clf.cli:data_main"
text-clf-train = "text_clf.cli:train_main"
text-clf-evaluate = "text_clf.cli:evaluate_main"
text-clf-register = "text_clf.cli:register_main"
text-clf-promote = "text_clf.cli:promote_main"
text-clf-rollback = "text_clf.cli:rollback_main"
text-clf-serve = "text_clf.cli:serve_main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==1.18.2",
    "pytest==9.1.1",
    "ruff==0.15.20",
]
training = [
    "datasets==5.0.0",
    "mlflow==3.14.0",
    "numpy==2.4.6",
    "omegaconf==2.3.1",
    "scikit-learn==1.9.0",
    "torchmetrics==1.9.0",
]
mlops = [
    { include-group = "training" },
    "dvc-s3==3.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/text_clf"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["integration: exercises multiple infrastructure components"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
explicit_package_bases = true
exclude = [
    "^dags/",
    "^src/text_clf/config.py$",
    "^src/text_clf/data/(dataset|datamodule).py$",
    "^src/text_clf/models/custom_transformer.py$",
    "^src/text_clf/training/trainer.py$",
    "^src/text_clf/utils/logger.py$",
    "^tests/test_models.py$",
]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "airflow.*",
    "dags.*",
    "datasets.*",
    "mlflow.*",
    "pandas.*",
    "torchmetrics.*",
    "transformers.*",
]
ignore_missing_imports = true
follow_imports = "skip"
